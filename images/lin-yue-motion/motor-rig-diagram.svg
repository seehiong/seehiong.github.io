<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>Lin Yue's 51 motor-inspired software controls</title>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#14252d"/><stop offset="1" stop-color="#071116"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#e8f2f2}.muted{fill:#9bb0b5}.bone{stroke:#56d7cf;stroke-width:12;stroke-linecap:round}.joint{fill:#d5ffef;stroke:#28c8ba;stroke-width:5}.box{fill:#13252d;stroke:#27515b;stroke-width:2}</style></defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="55" y="70" font-size="34" font-weight="bold">A character rig, thought of as 51 motors</text><text x="55" y="105" font-size="18" class="muted">Software actuator entries define allowed rotation and step size for each bone.</text>
<rect x="55" y="145" width="300" height="465" rx="20" class="box"/><text x="83" y="190" font-size="22" font-weight="bold">51 actuator entries</text>
<text x="83" y="244" font-size="19" font-weight="bold">Core &amp; torso</text><text x="83" y="271" font-size="16" class="muted">root, pelvis, spine, neck, head</text>
<text x="83" y="322" font-size="19" font-weight="bold">Arms &amp; hands</text><text x="83" y="349" font-size="16" class="muted">shoulders, elbows, wrists, fingers</text>
<text x="83" y="400" font-size="19" font-weight="bold">Legs &amp; feet</text><text x="83" y="427" font-size="16" class="muted">hips, knees, ankles, toes</text>
<line x1="88" y1="475" x2="130" y2="475" class="bone"/><circle cx="109" cy="475" r="10" class="joint"/><text x="149" y="481" font-size="15" class="muted">bone + controlled joint</text>
<text x="83" y="530" font-size="15" class="muted">Software controls, not physical motors.</text><text x="83" y="556" font-size="15" class="muted">Joint limits are checked per frame.</text>
<!-- figure -->
<g class="bone"><line x1="625" y1="242" x2="625" y2="355"/><line x1="625" y1="355" x2="625" y2="420"/><line x1="625" y1="215" x2="625" y2="242"/><line x1="625" y1="255" x2="545" y2="280"/><line x1="545" y1="280" x2="490" y2="355"/><line x1="490" y1="355" x2="450" y2="390"/><line x1="625" y1="255" x2="705" y2="280"/><line x1="705" y1="280" x2="760" y2="355"/><line x1="760" y1="355" x2="800" y2="390"/><line x1="625" y1="420" x2="575" y2="475"/><line x1="575" y1="475" x2="560" y2="570"/><line x1="560" y1="570" x2="535" y2="635"/><line x1="625" y1="420" x2="675" y2="475"/><line x1="675" y1="475" x2="690" y2="570"/><line x1="690" y1="570" x2="715" y2="635"/></g>
<g class="joint"><circle cx="625" cy="185" r="33"/><circle cx="625" cy="242" r="11"/><circle cx="625" cy="355" r="11"/><circle cx="625" cy="420" r="11"/><circle cx="545" cy="280" r="11"/><circle cx="490" cy="355" r="11"/><circle cx="705" cy="280" r="11"/><circle cx="760" cy="355" r="11"/><circle cx="575" cy="475" r="11"/><circle cx="560" cy="570" r="11"/><circle cx="675" cy="475" r="11"/><circle cx="690" cy="570" r="11"/></g>
<text x="847" y="250" font-size="19" font-weight="bold">Shoulder</text><text x="847" y="276" font-size="16" class="muted">multi-axis rotation</text><line x1="830" y1="260" x2="718" y2="280" stroke="#7ea8ac" stroke-width="2"/>
<text x="847" y="350" font-size="19" font-weight="bold">Elbow</text><text x="847" y="376" font-size="16" class="muted">bounded hinge motion</text><line x1="830" y1="360" x2="773" y2="355" stroke="#7ea8ac" stroke-width="2"/>
<text x="847" y="470" font-size="19" font-weight="bold">Knee</text><text x="847" y="496" font-size="16" class="muted">checked each frame</text><line x1="830" y1="480" x2="704" y2="475" stroke="#7ea8ac" stroke-width="2"/>
<rect x="390" y="680" width="175" height="48" rx="13" class="box"/><text x="477" y="710" text-anchor="middle" font-size="15">create_pose_*</text><path d="M570 704h35m-10-7 10 7-10 7" fill="none" stroke="#43d4c9" stroke-width="3"/>
<rect x="615" y="680" width="190" height="48" rx="13" class="box"/><text x="710" y="710" text-anchor="middle" font-size="15">limits + quantize</text><path d="M810 704h35m-10-7 10 7-10 7" fill="none" stroke="#43d4c9" stroke-width="3"/>
<rect x="855" y="680" width="175" height="48" rx="13" class="box"/><text x="942" y="710" text-anchor="middle" font-size="15">clip → GLB</text>
</svg>
