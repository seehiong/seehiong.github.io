            }
            handle /console/api/* {
                reverse_proxy http://dify-release-api-svc:5001
            }
            handle /v1/* {
                reverse_proxy http://dify-release-api-svc:5001
            }
            handle /api/enterprise/* {
                reverse_proxy http://dify-release-enterprise-svc:8082
            }
            handle /api/* {
