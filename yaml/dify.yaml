apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-release-minio
  labels:
    app: minio
    chart: minio-5.4.0
    release: dify-release
    heritage: Helm
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  replicas: 1
  selector:
    matchLabels:
      app: minio
      release: dify-release
  template:
    metadata:
      name: dify-release-minio
      labels:
        app: minio
        release: dify-release
      annotations:
        checksum/secrets: 6c024c8784f625fbb7d614e1a7c320ca27651e51c580b4c4a92ddb9b109df9ad
        checksum/config: c72641202ed902516b8ea987240e107ea6eb81d5fbbeb7cd0c8a2adda55b6382
    spec:
      
      serviceAccountName: minio-sa
      containers:
        - name: minio
          image: "quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z"
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-ce"
            - "/usr/bin/docker-entrypoint.sh minio server /export -S /etc/minio/certs/ --address :9000 --console-address :9001"
          volumeMounts:
            - name: minio-user
              mountPath: "/tmp/credentials"
              readOnly: true
            - name: export
              mountPath: /export            
          ports:
            - name: http
              containerPort: 9000
            - name: http-console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: dify-release-minio
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-release-minio
                  key: rootPassword
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          resources:
            limits:
              cpu: 1000m
              memory: 2048Mi
            requests:
              cpu: 500m
              memory: 1024Mi      
      volumes:
        - name: export
          emptyDir: {}
        - name: minio-user
          secret:
            secretName: dify-release-minio
