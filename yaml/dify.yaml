data:
  Caddyfile: |
    (cors) {
        @cors_preflight method OPTIONS
        @allow_origins {
          
            
          header Origin http://localhost:3000
            
          header Origin http://localhost:3001
            
          header Origin http://localhost:5001
            
          header Origin http://localhost:3002
            
          
          
          header Origin https://dify.lan
          header Origin https://
          header Origin https://dify-app.lan
          header Origin https://dify-app.lan
          header Origin https://dify-files.lan
          header Origin https://dify-api.lan
          header Origin https://
        }
        header @allow_origins {
          Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
          Vary Origin
          Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token"
          Access-Control-Allow-Credentials "true"
          Access-Control-Allow-Origin {header.origin}
        }
        handle @cors_preflight {
          header {
            Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE"
            Access-Control-Max-Age "3600"
          }
          respond "" 204
        }
    }

    {
        auto_https off
        order dify_audit before reverse_proxy
        order dify_credential_patcher before reverse_proxy
    }
    http://dify.lan:3080 {
    header {
        -Server
        -X-Powered-By
        Strict-Transport-Security "max-age=31536000;"
        Content-Security-Policy "frame-ancestors 'none';"
    }
        route {
    dify_audit "redis://:dGVzdHNlY3JldGtleQ==@dify-release-redis-master:6379/0" 7

            handle /console/api/workspaces/current/tool-provider/builtin/* {
