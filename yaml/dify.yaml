                    header_up Dify-Hook-Url {http.request.scheme}://{host}{uri}
                }
            }
            handle {
                reverse_proxy http://dify-release-web-svc:3000
            }
            handle_path /healthz {
                respond "OK"
            }
        }
        encode zstd gzip
    reverse_proxy {
        transport http {
            dial_timeout 10s
            keepalive 30s
            keepalive_interval 30s
        }
    }
    }

    http://:3080 {
        import cors {header.origin}
    header {
        -Server
        -X-Powered-By
        Strict-Transport-Security "max-age=31536000;"
        Content-Security-Policy "frame-ancestors 'none';"
    }
        route {
    dify_audit "redis://:dGVzdHNlY3JldGtleQ==@dify-release-redis-master:6379/0" 7
            handle /v1/audit/* {
                reverse_proxy http://dify-release-enterprise-audit-svc:8083
