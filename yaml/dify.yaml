    app: dify-release-crd
    control-plane: controller-manager

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
      app.kubernetes.io/instance: dify-release
      app: dify-release-crd
      control-plane: controller-manager

  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify
        app.kubernetes.io/instance: dify-release
        app: dify-release-crd
        control-plane: controller-manager

    spec:
      enableServiceLinks: false
      containers:
      - command:
        - /app/plugin-crd
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --namespaces=dify
        env:
        - name: NGINX_PORT
          value: "80"
        image: "langgenius/enterprise_plugin-crd:0.14.1"
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {}
        volumeMounts: []
      volumes: []
      serviceAccountName: dify-plugin-sa
      terminationGracePeriodSeconds: 10
