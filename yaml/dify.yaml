        command:
        - sh
        - -c
        - >
          until nc -z dify-release-minio 9000; do
            echo "waiting for minio...";
            sleep 2;
          done
      containers:
        - command:
            - ./plugin-connector
            - '-conf'
            - /config/config.yaml
            - '-gconf'
            - /config/gconfig.yaml
          image: "langgenius/enterprise_plugin-connector:0.14.1"
          imagePullPolicy: "IfNotPresent"
          name: dify-release-plugin-connector
          ports:
            - name: api
              protocol: TCP
              containerPort: 5004
          volumeMounts:
            - mountPath: /config/config.yaml
              name: config-volume
              subPath: config.yaml
            - mountPath: /config/gconfig.yaml
              name: secret-volume
              subPath: gconfig.yaml
          resources:
              {}
      serviceAccountName: dify-release-plugin-connector-sa
      volumes:
        - configMap:
            defaultMode: 420
            name: dify-release-plugin-connector-config
            items:
              - key: config.yaml
                path: config.yaml
          name: config-volume
        - secret:
            defaultMode: 420
            secretName: dify-release-plugin-connector-secret
            items:
              - key: gconfig.yaml
                path: gconfig.yaml
          name: secret-volume
